# actionlint ships a fixed list of GitHub-hosted runner labels and rejects
# anything outside it. macos-15-intel is real and predates this pin.
self-hosted-runner:
  labels:
    - macos-15-intel
paths:
  .github/workflows/docs.yml:
    ignore:
      # GitHub accepts concurrency.queue; actionlint does not know it yet.
      - '^unexpected key "queue" for "concurrency" section\. expected one of "cancel-in-progress", "group"$'
