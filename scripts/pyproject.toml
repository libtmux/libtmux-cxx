[project]
name = "libtmux-cxx-scripts"
version = "0"
description = "Support scripts for the libtmux C++ port: CI planning, documentation checks, the vcpkg registry tooling and the mutation catalogue."
authors = [{ name = "Tony Narlock", email = "tony@git-pull.com" }]
license = "MIT"
requires-python = ">=3.10"

# Not published, and not a package: this file holds the checks that govern
# `scripts/` and the dependency group that runs them. Each script declares its
# own dependencies inline (PEP 723) and runs with `uv run scripts/<name>/...`.
[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "ruff==0.17.4",
  "ty==0.0.107",
]

[tool.uv]
package = false
# Lock only releases at least three days old. Project settings override a
# contributor's own uv configuration, so `uv lock --check` gives the same
# answer on every machine.
exclude-newer = "3 days"

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "--doctest-modules -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
  "ci_plan",
  "docs",
  "mutate",
  "coverage",
  "include_cost",
  "schema",
  "vcpkg",
  "mcp_inventory",
  "workspace_cli",
  "installed_probe",
  "psmux",
  "release",
]

[tool.ruff]
src = []
target-version = "py310"

[tool.ruff.lint]
# `select` is deliberately unset: ruff enables a curated default set, and an
# explicit `select` would replace it rather than extend it.
extend-select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "E",    # pycodestyle
  "EM",   # flake8-errmsg
  "F",    # pyflakes
  "I",    # isort
  "PERF", # Perflint
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RUF",  # Ruff-specific rules
  "SIM",  # flake8-simplify
  "TRY",  # tryceratops
  "UP",   # pyupgrade
]
ignore = [
  "COM812", # trailing comma, conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ty.environment]
python-version = "3.10"
python-platform = "all"
extra-paths = [
  "ci_plan",
  "docs",
  "mutate",
  "coverage",
  "include_cost",
  "schema",
  "vcpkg",
  "mcp_inventory",
  "workspace_cli",
  "installed_probe",
  "psmux",
  "release",
]
