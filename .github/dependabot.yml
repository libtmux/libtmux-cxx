version: 2
updates:
  # Actions are pinned by commit, which is what makes them safe and also what
  # makes them invisible: nothing tells you a pin is a year old. Dependabot
  # reads the `# vX.Y.Z` comment beside each one and opens a pull request
  # moving the pin, comment included.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    # The trailing space stops Dependabot appending a colon.
    commit-message:
      prefix: "ci(deps) "

  # vcpkg.json gets no entry: no version constraints and no builtin-baseline,
  # so the updater has nothing to move.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "cxx(deps[dev]) "
