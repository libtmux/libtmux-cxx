name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'edges: the oldest and newest released tmux. full: the whole table, master and the refusal cells. custom: the tmux-ref and cxx-compiler below.'
        type: choice
        options: [edges, full, custom]
        default: edges
      tmux-ref:
        description: 'With scope custom: comma-separated tmux releases, tags, branches or 40-hex commits from github.com/tmux/tmux, for example 3.6b,master.'
        type: string
        default: ''
      cxx-compiler:
        description: 'Comma-separated compilers for the compatibility job, for example clang-19,gcc-14. Empty is the pinned clang.'
        type: string
        default: ''
      tmate:
        description: 'Open a tmate session on the one compatibility leg. Needs scope custom with a single tmux-ref.'
        type: choice
        options: ['off', before-tests, on-failure]
        default: 'off'
  # release.yml calls this with `scope: full`, so a release proves the whole
  # tmux table itself instead of borrowing a push run that covered the edges.
  workflow_call:
    inputs:
      scope:
        description: 'edges, full or custom'
        type: string
        default: edges

permissions:
  contents: read

concurrency:
  # A dispatch asks for one particular permutation, so it must not cancel the
  # push run on its branch or another dispatch on it. Pushes still supersede
  # each other.
  group: ci-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  plan:
    # The tmux axis of the matrix, from scripts/ci_plan/tmux_matrix.json and the
    # event. A push or pull request gets the oldest and newest released tmux;
    # a release, a schedule and `scope: full` get the whole table. The plan
    # also fails a dispatch that asks for something CI will not do before any
    # runner is spent on it.

    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.plan.outputs.scope }}
      compat: ${{ steps.plan.outputs.compat }}
      rejection: ${{ steps.plan.outputs.rejection }}
      rejection_planned: ${{ steps.plan.outputs.rejection_planned }}
      tmux_jobs: ${{ steps.plan.outputs.tmux_jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: Plan the tmux matrix
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          SCOPE: ${{ inputs.scope }}
          TMUX_REF: ${{ inputs.tmux-ref }}
          CXX_COMPILER: ${{ inputs.cxx-compiler }}
          TMATE: ${{ inputs.tmate }}
        run: |
          uv run scripts/ci_plan/ci_plan.py matrix \
            --event "$EVENT" --ref-type "$REF_TYPE" --scope "$SCOPE" \
            --tmux-ref "$TMUX_REF" --cxx-compiler "$CXX_COMPILER" \
            --tmate "$TMATE" --github-output "$GITHUB_OUTPUT"

  compatibility:
    # The C++ library claims the same tmux range as the Python one. A push
    # tests the ends of that range; the plan job says which versions a release
    # or a dispatch adds.
    name: compatibility (${{ matrix.slug }}, ${{ matrix.compiler }})
    needs: plan

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.compat) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `install` defaults to `detect`, so the action installs ccache with
      # the runner's package manager -- apt on Linux -- and never downloads
      # the ccache build pinned in its own metadata.json. A bump to this
      # action therefore moves @actions/cache and the action's own bundle,
      # not the ccache binary: CI currently runs ccache 4.9.1 on
      # ubuntu-24.04.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ matrix.compiler }}-tmux-${{ matrix.slug }}
          max-size: 400M

      - name: Install clang ${{ matrix.version }}
        if: matrix.family == 'clang'
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes clang-${{ matrix.version }} libc++-${{ matrix.version }}-dev libc++abi-${{ matrix.version }}-dev ninja-build

      - name: Select clang ${{ matrix.version }}
        if: matrix.family == 'clang'
        uses: ./.github/actions/select-clang
        with:
          version: ${{ matrix.version }}

      - name: Install gcc ${{ matrix.version }}
        if: matrix.family != 'clang'
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes gcc-${{ matrix.version }} g++-${{ matrix.version }} ninja-build

      # The action keys its cache on the commit the ref resolves to, so a
      # branch such as master is rebuilt when it moves instead of freezing the
      # lane at whatever the first run built.
      - name: Build tmux ${{ matrix.tmux }}
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.tmux }}
          add-to-path: "true"

      # Pinned by commit: v3.24, https://github.com/mxschmitt/action-tmate/commit/35b54af.
      # Only a dispatch gets here, and the plan allows one leg to.
      - name: Debug session before the tests
        if: github.event_name == 'workflow_dispatch' && matrix.tmate == 'before-tests'
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

      - name: Print the tmux version
        run: tmux -V

      # CMAKE_ARGS is the plan's space-separated list of options; the shell
      # splits it, and none of them holds a space or a glob character.
      - name: Configure against tmux ${{ matrix.tmux }}
        env:
          PRESET: ${{ matrix.preset }}
          CMAKE_ARGS: ${{ matrix.cmake_args }}
        run: |
          # shellcheck disable=SC2086
          cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache $CMAKE_ARGS --preset "$PRESET"

      - name: Build against tmux ${{ matrix.tmux }}
        env:
          PRESET: ${{ matrix.preset }}
        run: cmake --build --preset "$PRESET"

      - name: Test against tmux ${{ matrix.tmux }}
        env:
          PRESET: ${{ matrix.preset }}
        run: ctest --preset "$PRESET" --no-tests=error --output-on-failure

      # Runs on the newest released tmux, wherever the plan puts that leg. The
      # step exercises ctest under a long TMPDIR and needs no particular
      # release.
      - name: Create the macOS-length temporary directory
        if: matrix.long_path
        run: mkdir /tmp/mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm

      - name: Test with a macOS-length temporary path
        if: matrix.long_path
        env:
          PRESET: ${{ matrix.preset }}
          TMPDIR: /tmp/mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm
        run: ctest --preset "$PRESET" --no-tests=error --output-on-failure

      - name: Remove the macOS-length temporary directory
        if: ${{ !cancelled() && matrix.long_path }}
        run: rmdir /tmp/mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm

      - name: Debug session after a failure
        if: failure() && github.event_name == 'workflow_dispatch' && matrix.tmate == 'on-failure'
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        timeout-minutes: 30
        with:
          limit-access-to-actor: true

  rejection:
    # Releases below the floor are not a supported cell. They are run to prove
    # the refusal: a daemon of each is started, a client at the floor is
    # pointed at it, and nothing the library, the workspace CLI or the MCP
    # server sends may change it. 3.0a and 3.1c answer the probe differently
    # from every later release and keep a client's stdout open after it exits,
    # so their cells also hold the refusal to a time bound. They are part of
    # the whole table, so only a release and a full-scope dispatch run them.
    needs: plan
    if: needs.plan.outputs.rejection_planned == 'true'

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rejection) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-tmux-${{ matrix.rejected-tmux }}
          max-size: 400M

      - name: Install the pinned toolchain
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes clang-18 libc++-18-dev libc++abi-18-dev ninja-build

      - name: Select clang 18
        uses: ./.github/actions/select-clang

      - name: Build the supported client
        id: client
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.client-tmux }}
          add-to-path: "true"

      - name: Build the rejected daemon
        id: rejected
        uses: libtmux/.github/actions/build-tmux@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          ref: ${{ matrix.rejected-tmux }}

      - name: Print the client tmux version
        run: tmux -V

      - name: Print the rejected daemon version
        env:
          REJECTED_TMUX: ${{ steps.rejected.outputs.binary }}
        run: '"$REJECTED_TMUX" -V'

      - name: Configure
        run: cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx-dev

      - name: Build the targets that refuse
        run: cmake --build --preset cxx-dev --target libtmux_support_versions_test workspace_cli_test mcp_tools_test mcp_protocol_test

      - name: Refuse tmux ${{ matrix.rejected-tmux }} without effects
        env:
          LIBTMUX_TEST_REJECTED_TMUX: ${{ steps.rejected.outputs.binary }}
          LIBTMUX_REQUIRE_REJECTED_TMUX: "1"
        run: ctest --preset cxx-dev --no-tests=error --output-on-failure -R 'libtmux\.support_versions\.|^consumer\..*\.rejected$'

  windows:
    # Build and install the narrower Windows backend and package with MSVC;
    # a MinGW-only success cannot stand in for Windows support.

    strategy:
      fail-fast: false
      matrix:
        standard: [20, 23]
    # The preset intentionally targets Visual Studio 2022.
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: Check Windows registry tooling
        run: uv run --group dev pytest scripts/vcpkg/tests/test_vcpkg_probe.py scripts/vcpkg/tests/test_vcpkg_release.py

      # Nothing here starts psmux: this lane builds and installs, and runs the
      # steps that need no tmux. The psmux tests are run by hand.
      - name: Configure the native Windows targets
        run: cmake --preset windows-psmux "-DLIBTMUX_CXX_STANDARD=${{ matrix.standard }}"

      - name: Build the native Windows targets
        run: cmake --build --preset windows-psmux

      - name: Build the native Windows targets in Release
        run: cmake --build build/windows-psmux --config Release

      - name: Install the MSVC package
        env:
          PREFIX: ${{ github.workspace }}\build\windows-prefix
        run: cmake --install build/windows-psmux --config Debug --prefix $env:PREFIX

      - name: Configure a consumer of the MSVC package
        env:
          PREFIX: ${{ github.workspace }}\build\windows-prefix
        run: cmake -S examples/consume -B build/windows-consume -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:PREFIX"

      - name: Build the consumer of the MSVC package
        run: cmake --build build/windows-consume --config Debug

      - name: Run the consumer of the MSVC package
        run: .\build\windows-consume\Debug\consume.exe

      - name: Reject the POSIX-only testing component
        env:
          PREFIX: ${{ github.workspace }}\build\windows-prefix
        run: uv run scripts/installed_probe/installed_probe.py testing-component -- -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:PREFIX"

      # Windows advertises the same registry as POSIX and lets psmux refuse what
      # it cannot do, rather than hiding those tools; see
      # docs/design/windows-psmux.md. The list is
      # scripts/installed_probe/windows_mcp_tools.txt.
      - name: Check the installed Windows MCP catalog
        run: uv run scripts/installed_probe/installed_probe.py mcp-catalog --server build\windows-prefix\bin\libtmux-mcp-server.exe --socket-name libtmux-cxx-mcp-catalog --expect-tools scripts/installed_probe/windows_mcp_tools.txt

  toolchains:
    # A second compiler and standard library. Everything here built and passed
    # only under clang and libc++ until three lines of duration arithmetic were
    # spelled explicitly, which no lane would have caught.

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install GCC, tmux and Ninja
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes g++ tmux ninja-build

      - name: Print the GCC version
        run: g++ --version

      - name: Configure with GCC and libstdc++
        run: cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx-gcc

      - name: Build with GCC and libstdc++
        run: cmake --build --preset cxx-gcc

      - name: Test with GCC and libstdc++
        run: ctest --preset cxx-gcc --no-tests=error --output-on-failure

  benchmarks:
    # Neither program is linked into the shipped package or gates a merge on
    # a time budget; see BENCHMARKS.md. This job exists so a regression in
    # what they measure - a build break, a lane no longer answering the
    # question it claims to - is caught here rather than the next time a
    # maintainer runs them by hand.

    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install the pinned toolchain and tmux
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes clang-18 libc++-18-dev libc++abi-18-dev ninja-build tmux

      - name: Select clang 18
        uses: ./.github/actions/select-clang

      # LIBTMUX_BUILD_TESTING_LIBRARY defaults on only with tests or examples,
      # both off here, and both benchmarks link libtmux::testing.
      - name: Configure both programs
        run: cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx-dev -DLIBTMUX_BUILD_TESTS=OFF -DLIBTMUX_BUILD_EXAMPLES=OFF -DLIBTMUX_BUILD_MCP_SERVER=OFF -DLIBTMUX_BUILD_TESTING_LIBRARY=ON -DLIBTMUX_BUILD_BENCHMARKS=ON

      - name: Build both programs
        run: cmake --build --preset cxx-dev --target libtmux_matrix libtmux_operations_bench

      - name: Run the transport matrix
        run: ./build/cxx-dev/apps/matrix/libtmux_matrix

      - name: Assert the transport matrix's own claims
        run: ./build/cxx-dev/apps/matrix/libtmux_matrix --check

      - name: Run the operations benchmark
        run: ./build/cxx-dev/benchmarks/libtmux_operations_bench

  standards:
    # The C++20 configuration substitutes a different expected and carries its
    # own ABI namespace. Until this lane existed, the only thing that had ever
    # been built against it was one example program.

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install the pinned toolchain and tmux
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes clang-18 libc++-18-dev libc++abi-18-dev ninja-build tmux

      - name: Select clang 18
        uses: ./.github/actions/select-clang

      - name: Configure the C++20 configuration
        run: cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx20

      - name: Build the C++20 configuration
        run: cmake --build --preset cxx20

      - name: Test the C++20 configuration
        run: ctest --preset cxx20 --no-tests=error --output-on-failure

  fuzz:
    # Four parsers read input the library does not choose. A short run over the
    # checked-in corpus is the gate; it found a real ambiguity between an
    # option name that ends in an asterisk and the marker tmux uses for an
    # inherited one.

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install the pinned toolchain
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes clang-18 ninja-build

      - name: Select clang 18
        uses: ./.github/actions/select-clang

      # The fuzzer runtime this toolchain ships is built against libstdc++,
      # which has no usable <expected> here, so the fuzzers build in the C++20
      # configuration over the pinned compatibility type.
      - name: Configure the fuzzers
        run: cmake -S . -B build/fuzz -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DLIBTMUX_CXX_STANDARD=20 -DLIBTMUX_BUILD_FUZZERS=ON -DLIBTMUX_BUILD_TESTS=OFF -DLIBTMUX_BUILD_EXAMPLES=OFF -DLIBTMUX_FETCH_DEPS=ON

      - name: Build the fuzzers
        run: cmake --build build/fuzz

      - name: Fuzz the parsers
        run: ctest --test-dir build/fuzz --no-tests=error --output-on-failure

  locale:
    # tmux decides whether the terminal is UTF-8 from the environment, and the
    # separator this library asks it to print between format values is
    # multi-byte. A lane that is not UTF-8 is the only thing that checks the
    # library does not depend on its caller's locale.

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install the pinned toolchain and tmux
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes clang-18 libc++-18-dev libc++abi-18-dev ninja-build tmux

      - name: Select clang 18
        uses: ./.github/actions/select-clang

      # LC_ALL overrides LANG for every category, so LANG needs no unsetting.
      - name: Configure in a C locale
        env:
          LC_ALL: C
          LC_CTYPE: C
        run: cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx-dev

      - name: Build in a C locale
        env:
          LC_ALL: C
          LC_CTYPE: C
        run: cmake --build --preset cxx-dev

      - name: Test in a C locale
        env:
          LC_ALL: C
          LC_CTYPE: C
        run: ctest --preset cxx-dev --no-tests=error --output-on-failure

  sanitizers:

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Address and thread sanitizers need separate build trees; enabling
        # both at once is rejected at configure time.
        sanitizer: [cxx-sanitize, cxx-sanitize-cxx20, cxx-tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ matrix.sanitizer }}
          max-size: 400M

      - name: Install the pinned toolchain and tmux
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes clang-18 libc++-18-dev libc++abi-18-dev ninja-build tmux

      - name: Select clang 18
        uses: ./.github/actions/select-clang

      - name: Configure under ${{ matrix.sanitizer }}
        run: cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset ${{ matrix.sanitizer }}

      - name: Build under ${{ matrix.sanitizer }}
        run: cmake --build --preset ${{ matrix.sanitizer }}

      - name: Run the suite under ${{ matrix.sanitizer }}
        run: ctest --preset ${{ matrix.sanitizer }} --no-tests=error --output-on-failure

  mutation:
    # A green suite is evidence only once it has been shown capable of
    # failing. Each catalogued mutation breaks one guard that exists because
    # tmux does something quiet, and a survivor names what went unnoticed.
    # A mutation that no longer applies, or no longer builds, fails the job
    # too: run by hand that case prints nothing and reads like a pass.

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: Install tmux and a compiler
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes tmux ninja-build clang-18 libc++-18-dev libc++abi-18-dev

      - name: Select clang 18
        uses: ./.github/actions/select-clang

      - name: Configure
        run: cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx-dev

      - name: Break each guard and check something notices
        run: uv run --group dev python scripts/mutate/mutate.py --preset cxx-dev

  coverage:
    # Not here to police a percentage. Coverage tooling is used by nobody on
    # an ordinary day, so it rots quietly and is then untrustworthy exactly
    # when someone reaches for it; running it every time keeps it honest. The
    # floor is set well under the current figure so it catches a collapse —
    # instrumentation silently disabled, a suite that stopped running — and
    # not the ordinary drift of a few lines.

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: Install the pinned toolchain and tmux
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes clang-18 libc++-18-dev libc++abi-18-dev llvm-18 ninja-build tmux

      - name: Select clang 18
        uses: ./.github/actions/select-clang

      - name: Configure for coverage
        run: cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx-coverage

      - name: Build for coverage
        run: cmake --build --preset cxx-coverage

      - name: Run the suite for coverage
        run: ctest --preset cxx-coverage --no-tests=error --output-on-failure

      - name: Measure what the suite reaches
        run: uv run scripts/coverage/coverage_report.py --build build/cxx-coverage --source . --floor 65

  lint:

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ACTIONLINT_VERSION: 1.7.7
      ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
      ACTIONLINT_ARCHIVE: actionlint_1.7.7_linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install the pinned toolchain
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes clang-18 clang-format-18 clang-tidy-18 libc++-18-dev libc++abi-18-dev ninja-build g++ doxygen

      - name: Select clang 18
        uses: ./.github/actions/select-clang

      - name: Select clang-format 18
        run: sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100

      - name: Select clang-tidy 18
        run: sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

      # release.yml triggers on tags alone, so no other lane parses it. An
      # unsupported key there fails every release before a job can start.
      - name: Download actionlint
        run: curl -fsSL -o "$ACTIONLINT_ARCHIVE" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${ACTIONLINT_ARCHIVE}"

      - name: Verify the actionlint archive
        run: echo "${ACTIONLINT_SHA256}  ${ACTIONLINT_ARCHIVE}" | sha256sum --check --strict

      - name: Unpack actionlint
        run: tar xzf "$ACTIONLINT_ARCHIVE" actionlint

      - name: Check the workflows parse
        run: ./actionlint -color

      - name: Check formatting
        run: |
          find include src tests apps examples benchmarks tools/mcp \
            \( -name '*.hpp' -o -name '*.cpp' \) \
            -exec clang-format --dry-run --Werror --style=file {} +

      - name: Check the API reference is current
        run: uv run scripts/docs/api_index.py --include include/libtmux --output docs/api.md --check

      - name: Check the testing API reference is current
        run: uv run scripts/docs/api_index.py --include include/libtmux/testing --output docs/api-testing.md --page testing --check

      - name: Check what including the library costs
        run: uv run scripts/include_cost/include_cost.py --check

      - name: Check what including the library costs with g++
        run: uv run scripts/include_cost/include_cost.py --compiler g++ --check

      # The headers are the only source of the published reference, and a
      # Doxygen warning means part of one did not survive the parse: a comment
      # that never reached the XML, or markup that swallowed the text after it.
      # Neither is visible in a build that merely exits zero.
      - name: Print the Doxygen version
        run: doxygen --version

      - name: Check the Doxygen comments parse
        env:
          OUTPUT_DIRECTORY: ${{ runner.temp }}/doxygen
        run: doxygen Doxyfile

      # The same Sphinx build libtmux.org serves, run over the XML above. A
      # declaration Sphinx cannot parse is not a Doxygen warning: it reaches
      # the page as unparsed text with no anchor, and only this lane sees it.
      # Breathe 5.0.0 cannot find the header a `doxygenfile` directive names.
      - name: Check the reference renders
        working-directory: docs
        run: uv run --no-project --with sphinx --with breathe==4.36.0 --with furo sphinx-build -q -W -b dirhtml -D breathe_projects.cxx="${{ runner.temp }}/doxygen/xml" -d "${{ runner.temp }}/doctrees" . "${{ runner.temp }}/reference"

      - name: Check Python formatting
        run: uv run --group dev ruff format --check .

      - name: Lint Python
        run: uv run --group dev ruff check .

      - name: Type-check the scripts
        run: uv run --group dev ty check scripts

      - name: Test the scripts
        run: uv run --group dev pytest

      # The tmux versions CI runs come from scripts/ci_plan/tmux_matrix.json.
      # This fails when the README, the compatibility page or CONTRIBUTING say
      # something else, or when this workflow grows a list of its own.
      - name: Check the CI plan and the docs agree
        run: uv run scripts/ci_plan/ci_check.py

      # The README's C++ is quoted from an example that is compiled and run.
      # This is the half that checks the quoting; the example lane checks that
      # the code still works.
      - name: Check the README quotes code that builds
        run: uv run scripts/docs/check_readme.py --readme README.md --readme include/libtmux/README.md --readme docs/runtime.md

      # Links resolve in the checkout, an API is linked where a README first
      # names it, and the cmake commands name options and presets that exist.
      # The tmux-workspace and libtmux-mcp-server commands need the binaries,
      # so the consumer.*.readme_commands tests run them.
      - name: Check README links
        run: uv run scripts/docs/check_readme_links.py

      - name: Check README commands
        run: uv run scripts/docs/check_readme_commands.py --cmake

      - name: Check every README region compiles as its own snippet
        run: uv run scripts/docs/check_example_isolation.py

      # The library and each program keep a changelog of their own, and a
      # program installs its changelog beside it. Nothing else notices one
      # going missing, or a release that one forgot to list.
      - name: Check every package keeps and installs its changelog
        run: uv run scripts/docs/check_changelogs.py

      - name: Configure clang-tidy
        run: cmake -S . -B build/tidy -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/clang-libcxx.cmake -DLIBTMUX_ENABLE_CLANG_TIDY=ON -DLIBTMUX_BUILD_TESTS=OFF

      - name: Run clang-tidy over the library
        run: cmake --build build/tidy

  package:
    # Proves the shipped package, not the build tree: install it and build an
    # outside project that knows only find_package.

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        standard: ['23', '20']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-cxx${{ matrix.standard }}
          max-size: 400M

      - name: Install the pinned toolchain
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes clang-18 libc++-18-dev libc++abi-18-dev ninja-build

      - name: Select clang 18
        uses: ./.github/actions/select-clang

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: Configure the package build for C++${{ matrix.standard }}
        run: cmake -S . -B build/pkg -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/clang-libcxx.cmake -DCMAKE_BUILD_TYPE=Release -DLIBTMUX_CXX_STANDARD=${{ matrix.standard }} -DLIBTMUX_BUILD_TESTS=OFF -DLIBTMUX_BUILD_MCP_SERVER=ON -DLIBTMUX_BUILD_WORKSPACE_CLI=ON -DLIBTMUX_BUILD_TESTING_LIBRARY=ON -DLIBTMUX_FETCH_DEPS=ON

      - name: Build the package
        run: cmake --build build/pkg

      - name: Install the package
        run: cmake --install build/pkg --prefix "$GITHUB_WORKSPACE/build/prefix"

      - name: The installed workspace CLI prints its command tree
        run: uv run scripts/installed_probe/installed_probe.py workspace-tree --binary build/prefix/bin/tmux-workspace

      - name: The installed workspace CLI completes in bash
        run: uv run scripts/installed_probe/installed_probe.py workspace-completion --binary build/prefix/bin/tmux-workspace

      - name: The install carries the files C++${{ matrix.standard }} needs
        run: uv run scripts/installed_probe/installed_probe.py package-layout --prefix build/prefix --standard ${{ matrix.standard }}

      - name: Configure a consumer of the installed package
        run: cmake -S examples/consume -B build/consume -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/prefix" -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-stdlib=libc++

      - name: Build the consumer of the installed package
        run: cmake --build build/consume

      - name: Run the consumer of the installed package
        run: ./build/consume/consume

      # The examples, built and run the way a reader would: as their own
      # project, against the install above, knowing nothing but
      # `find_package`. The in-tree lane already runs the same sources, so
      # this is not about the examples working — it is about the package
      # being enough to build and test them, which only fails here.
      #
      # tmux, because unlike every other step in this job these tests drive a
      # real server. They start it themselves, under a namespaced socket in a
      # directory they remove.
      - name: Install tmux
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          args: install --yes tmux

      - name: Configure the examples against the installed package
        run: cmake -S examples -B build/examples -G Ninja -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/build/prefix" -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-stdlib=libc++ -DLIBTMUX_EXAMPLES_BUILD_TESTS=ON -DLIBTMUX_FETCH_DEPS=ON

      - name: Build the examples against the installed package
        run: cmake --build build/examples

      - name: The installed package is enough to test the examples
        run: ctest --test-dir build/examples --no-tests=error --output-on-failure

      # The program is the half of the package a library consumer never
      # links, so building it is not enough: this runs the installed copy the
      # way an agent starts it, over stdio, and requires a reply.
      #
      # Needs no tmux. These requests are answered by the protocol layer alone,
      # which is what this job is for — whether the tools then drive tmux
      # correctly is what the test lanes run a real server to find out.
      - name: The installed MCP server answers on stdio
        run: uv run scripts/installed_probe/installed_probe.py mcp-catalog --server build/prefix/bin/libtmux-mcp-server --socket-name "libtmux-cxx-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-catalog" --check-arguments

      # Well-formed JSON that is not a well-formed request. Each of these
      # parsed cleanly and then threw out of a typed read, which escaped main
      # and ended the process — so a peer could stop the server with a line
      # containing `[1,2,3]`. Malformed JSON was already handled; being valid
      # JSON of the wrong shape was the gap.
      - name: The installed MCP server survives valid JSON of the wrong shape
        run: |
          uv run scripts/installed_probe/installed_probe.py mcp-hostile \
            --server build/prefix/bin/libtmux-mcp-server \
            --socket-name "libtmux-cxx-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-hostile"

  registry:
    # This repository is a vcpkg git registry, so a consumer resolves the port
    # through `versions/` rather than from `ports/` directly. Two questions,
    # and the cheap one does not answer the expensive one: whether the database
    # still describes the ports, and whether vcpkg can actually resolve them.

    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Unshallowed because vcpkg fetches the baseline commit out of this
      # clone, and resolves the port from the git-tree recorded against it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: The versions database describes the ports
        run: uv run scripts/vcpkg/vcpkg_registry.py check

      - name: Clone vcpkg
        run: git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"

      - name: Check out the pinned vcpkg
        run: git -C "$RUNNER_TEMP/vcpkg" checkout --detach 94a541197763a4f449a1b91478df48c0584a6256

      - name: Bootstrap vcpkg
        run: '"$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Install Ninja
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes ninja-build

      # The whole chain a consumer walks: baseline commit, git-tree, release
      # tarball by hash, package config, find_package. It is also the only
      # place the shipped MCP server is run from an installed tree rather than
      # a build tree.
      - name: A consumer resolves the port and builds on it
        run: |
          uv run scripts/vcpkg/vcpkg_registry.py probe \
            --vcpkg "$RUNNER_TEMP/vcpkg" \
            --triplet x64-linux \
            --feature mcp

  all-checks-passed:
    # Branch protection requires this one job. Naming every matrix leg there
    # instead would mean editing the protection rule whenever a tmux version
    # or a sanitizer is added, and a leg that is renamed and forgotten stops
    # being required without anything saying so.
    #
    # Every job below must have succeeded. The one exception is `rejection`,
    # which the plan skips outside full scope; ci_check.py fails when a job
    # in this file is missing from the list.
    if: always()
    needs:
      - plan
      - compatibility
      - rejection
      - windows
      - toolchains
      - benchmarks
      - standards
      - fuzz
      - locale
      - sanitizers
      - mutation
      - coverage
      - lint
      - package
      - registry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: Every planned job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          REJECTION_PLANNED: ${{ needs.plan.outputs.rejection_planned }}
        run: |
          uv run scripts/ci_plan/ci_plan.py verify \
            --needs "$NEEDS" --rejection-planned "$REJECTION_PLANNED"
