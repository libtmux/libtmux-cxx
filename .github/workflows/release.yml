name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # One registry cut at a time, never cancelled. GitHub holds at most one
  # pending run per group, so a superseded tag must be re-run by hand.
  group: release-registry
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ci:
    # A release proves the whole tmux table, the refusal cells and master. A
    # push to master runs only the oldest and newest release, so its run
    # cannot stand in for this one; the tag commit is tested here at full
    # scope, and everything that publishes waits for it.
    uses: ./.github/workflows/ci.yml
    with:
      scope: full

  source:
    # What package managers actually consume. A C++ library has no stable ABI
    # across compiler, standard library, standard version or sanitizer flags,
    # and this one carries two ABI namespaces deliberately — so the artifact
    # that matters is the source, and its hash.
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha512: ${{ steps.archive.outputs.sha512 }}
      port_sha512: ${{ steps.port.outputs.sha512 }}
      version: ${{ steps.archive.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: The tag is merged and fixed
        run: uv run scripts/release/release_steps.py tag-fixed --local-tag --fetch-master --ancestor-of origin/master

      # The tag names the release; `VERSION` is what the library reports about
      # itself and what CMake writes into the package config. Nothing kept the
      # two together, so a `v0.2.0` tag on a tree that still said `0.1.0` would
      # publish an archive whose library disagrees with the release it came
      # from — and the mismatch is invisible until somebody reads
      # `library_version()` and is told the wrong thing.
      - name: The tag and VERSION agree
        run: uv run scripts/release/release_steps.py tag-version

      # The MCP server is the one program published compiled, and its users read
      # its changelog rather than the library's. This stops a release whose
      # program lost its changelog, then names the file for the release page.
      - name: Every package has its changelog
        run: uv run scripts/docs/check_changelogs.py

      - name: Name the server's changelog for the release
        run: cp apps/mcp/CHANGELOG.md "CHANGELOG-libtmux-mcp-server-${GITHUB_REF_NAME#v}.md"

      - name: Build the source archive and hash it
        id: archive
        run: uv run scripts/release/release_steps.py source-archive

      - name: The SHA512 the vcpkg port needs
        id: port
        run: uv run scripts/release/release_steps.py port-hash --repository "$GITHUB_REPOSITORY"

      - name: Install Ninja and GCC
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes ninja-build g++

      - name: Unpack the source archive
        env:
          VERSION: ${{ steps.archive.outputs.version }}
        run: tar -xzf "libtmux-cxx-${VERSION}.tar.gz" -C /tmp

      - name: Configure the unpacked archive
        env:
          VERSION: ${{ steps.archive.outputs.version }}
        run: cmake -S "/tmp/libtmux-cxx-${VERSION}" -B /tmp/rel -G Ninja -DLIBTMUX_BUILD_TESTS=OFF -DLIBTMUX_BUILD_EXAMPLES=OFF

      - name: Build the unpacked archive
        run: cmake --build /tmp/rel

      - name: Install the unpacked archive
        run: cmake --install /tmp/rel --prefix /tmp/relprefix

      - name: The install carries the package configuration
        run: test -f /tmp/relprefix/lib/cmake/libtmux/libtmuxConfig.cmake

      - name: The install carries the license
        run: test -f /tmp/relprefix/share/licenses/libtmux/LICENSE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: libtmux-cxx-*.tar.gz
          if-no-files-found: error

      # Named `server-*` so the publish job downloads it with the binaries.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-changelog
          path: CHANGELOG-libtmux-mcp-server-*.md
          if-no-files-found: error

  server:
    # The one thing here worth shipping compiled. Nobody links the MCP server;
    # they run it, and someone wiring up an agent CLI wants a binary rather
    # than a CMake invocation.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux-x86_64
          - runner: macos-latest
            name: macos-arm64
          - runner: macos-15-intel
            name: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ninja and GCC
        if: runner.os == 'Linux'
        uses: libtmux/.github/actions/apt-get@30f81842b1e639ea4e25f93f1f2543504178e228
        with:
          update: "true"
          args: install --yes ninja-build g++

      - name: Install Ninja
        if: runner.os == 'macOS'
        run: brew install ninja

      # GCC with its runtime linked in on Linux, so the binary does not need a
      # matching libstdc++ on the machine that runs it. A library could not
      # ship this way; a program can. The linker flags are one argument
      # containing a space, so the whole option is quoted.
      - name: Configure the server with its runtime linked in
        if: runner.os == 'Linux'
        run: cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIBTMUX_BUILD_MCP_SERVER=ON -DLIBTMUX_FETCH_DEPS=ON -DLIBTMUX_BUILD_TESTS=OFF -DLIBTMUX_BUILD_EXAMPLES=OFF "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"

      - name: Configure the server
        if: runner.os != 'Linux'
        run: cmake -S . -B build/rel -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIBTMUX_BUILD_MCP_SERVER=ON -DLIBTMUX_FETCH_DEPS=ON -DLIBTMUX_BUILD_TESTS=OFF -DLIBTMUX_BUILD_EXAMPLES=OFF

      - name: Build the server
        run: cmake --build build/rel

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      # Linux only: the macOS binaries are built and published, but CI does
      # not run them.
      - name: It answers before it is published
        if: runner.os == 'Linux'
        run: uv run scripts/installed_probe/installed_probe.py mcp-catalog --server build/rel/apps/mcp/libtmux-mcp-server --socket-name "libtmux-cxx-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_OS}"

      - name: Name it for the platform it was built on
        env:
          PLATFORM: ${{ matrix.name }}
        run: uv run scripts/release/release_steps.py name-asset --source build/rel/apps/mcp/libtmux-mcp-server --output "libtmux-mcp-server-{version}-$PLATFORM"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.name }}
          path: |
            libtmux-mcp-server-*
          if-no-files-found: error

  server-windows:
    needs: [source]
    runs-on: windows-2022
    timeout-minutes: 150
    outputs:
      base_port_tree: ${{ steps.validated-port.outputs.base_tree }}
      port_patch_sha256: ${{ steps.validated-port.outputs.sha256 }}
      validated_port_tree: ${{ steps.validated-port.outputs.validated_tree }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: Check Windows registry tooling
        run: uv run --group dev pytest scripts/vcpkg/tests/test_vcpkg_probe.py scripts/vcpkg/tests/test_vcpkg_release.py

      - name: Configure the tagged Windows release
        run: cmake -S . -B build/rel -G "Visual Studio 17 2022" -A x64 -DLIBTMUX_BUILD_MCP_SERVER=ON -DLIBTMUX_FETCH_DEPS=ON -DLIBTMUX_BUILD_TESTS=ON -DLIBTMUX_BUILD_EXAMPLES=ON -DLIBTMUX_BUILD_TESTING_LIBRARY=OFF -DLIBTMUX_BUILD_FUZZERS=OFF -DLIBTMUX_WARNINGS_AS_ERRORS=ON -DLIBTMUX_CXX_STANDARD=23 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build the tagged Windows release
        run: cmake --build build/rel --config Release

      - name: Install the tagged package
        env:
          PREFIX: ${{ github.workspace }}\build\release-prefix
        run: cmake --install build/rel --config Release --prefix $env:PREFIX

      - name: Configure a consumer of the tagged package
        env:
          PREFIX: ${{ github.workspace }}\build\release-prefix
        run: cmake -S examples/consume -B build/release-consume -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:PREFIX" -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build the consumer of the tagged package
        run: cmake --build build/release-consume --config Release

      - name: Run the consumer of the tagged package
        run: .\build\release-consume\Release\consume.exe

      - name: Transition the vcpkg port
        env:
          VERSION: ${{ needs.source.outputs.version }}
          PORT_SHA512: ${{ needs.source.outputs.port_sha512 }}
        run: uv run scripts/vcpkg/vcpkg_registry.py release --version $env:VERSION --sha512 $env:PORT_SHA512 --enable-windows

      - name: Clone vcpkg
        run: git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"

      - name: Check out the pinned vcpkg
        run: git -C "$env:RUNNER_TEMP\vcpkg" checkout --detach 94a541197763a4f449a1b91478df48c0584a6256

      - name: Bootstrap vcpkg
        run: '& "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Hold the transitioned port to the Windows triplets
        run: uv run scripts/vcpkg/windows_port_gate.py --vcpkg "$env:RUNNER_TEMP\vcpkg"

      - name: Seal the validated port transition
        id: validated-port
        run: uv run scripts/release/release_steps.py seal-port --patch build/validated-port.patch

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-windows-port
          path: build/validated-port.patch
          if-no-files-found: error

      - name: Name it for Windows
        run: uv run scripts/release/release_steps.py name-asset --source build\rel\apps\mcp\Release\libtmux-mcp-server.exe --output "libtmux-mcp-server-{version}-windows-x86_64.exe"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-windows-x86_64
          path: |
            libtmux-mcp-server-*
          if-no-files-found: error

  publish:
    needs:
      - source
      - server
      - server-windows
      - registry
      - registry-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Both needed by the attestation: it signs with a short-lived OIDC
      # identity rather than a stored key.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: The immutable tag and registry baseline still agree
        env:
          BASELINE: ${{ needs.registry.outputs.baseline }}
        run: uv run scripts/release/release_steps.py tag-fixed --fetch-master --master-baseline "$BASELINE"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: server-*
          path: artifacts
          merge-multiple: true

      - name: What is being published
        run: ls -l artifacts

      - name: Describe what is in the archive
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: artifacts/libtmux-cxx.spdx.json

      - name: Attest what built these
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          draft: true
          # A semantic version carries its prerelease tag after a hyphen, and
          # nothing else in a `v*` tag has one — so the tag itself decides,
          # rather than someone remembering to tick a box.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Installing

            A C++ library is published as source: there is no ABI shared
            across compilers, standard libraries or standard versions, and
            this one carries two ABI namespaces on purpose.

            This repository is its own [vcpkg registry][registry], because the
            project is too new to meet vcpkg's maturity bar for the curated
            one. With `libtmux` in your `vcpkg.json`, pin vcpkg's own baseline
            *before* naming any registry — a configuration that names one will
            not load until the default registry has a baseline:

            ```console
            $ vcpkg x-update-baseline --add-initial-baseline
            ```

            Then add `vcpkg-configuration.json` with this release's exact
            registry baseline:

            ```json
            {
              "registries": [
                {
                  "kind": "git",
                  "repository": "https://github.com/${{ github.repository }}",
                  "baseline": "${{ needs.registry.outputs.baseline }}",
                  "packages": ["libtmux"]
                }
              ]
            }
            ```

            The `libtmux-mcp-server-*` binaries below are the exception —
            that is a program, not a library. Verify one with
            `gh attestation verify <file> --repo ${{ github.repository }}`.
            `CHANGELOG-libtmux-mcp-server-*.md` is that program's changelog.

            Windows is a bounded x64 desktop preview through the pinned psmux
            build, supported on a best-effort basis: this release builds it
            but does not run it against psmux. MinGW, UWP, Xbox, non-x64 targets, persistent control mode,
            and unsafe typed mutations remain unsupported; see the
            [Windows boundary][windows] before adopting it.

            [registry]: https://github.com/${{ github.repository }}/blob/${{ needs.registry.outputs.baseline }}/docs/vcpkg-registry.md
            [windows]: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#windows-through-psmux

            ## Checksums

            `SHA512` of the source archive attached below:

            ```
            ${{ needs.source.outputs.sha512 }}
            ```

            `SHA512` of the archive GitHub generates for this tag, which is
            the one the vcpkg port fetches. They differ: same contents,
            different gzip.

            ```
            ${{ needs.source.outputs.port_sha512 }}
            ```

  registry:
    # The port fetches its source archive by hash, and that hash cannot exist
    # before the tag does: GitHub generates the archive on demand, and it is
    # not byte-identical to `git archive`'s. So the port is pointed at a
    # release only after that release is tagged, which is why this commit lands
    # on master rather than inside the tag it describes.
    needs: [source, server, server-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      baseline: ${{ steps.prepare.outputs.baseline }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-windows-port
          path: build/validated-port

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: The release commit and tag still belong to master
        run: uv run scripts/release/release_steps.py tag-fixed --ancestor-of HEAD

      - name: Apply the exact validated port transition
        id: port
        env:
          BASE_PORT_TREE: ${{ needs.server-windows.outputs.base_port_tree }}
          PORT_PATCH_SHA256: ${{ needs.server-windows.outputs.port_patch_sha256 }}
          VALIDATED_PORT_TREE: ${{ needs.server-windows.outputs.validated_port_tree }}
        run: uv run scripts/release/release_steps.py apply-validated-port --patch build/validated-port/validated-port.patch --patch-sha256 "$PORT_PATCH_SHA256" --base-tree "$BASE_PORT_TREE" --validated-tree "$VALIDATED_PORT_TREE"

      - name: Name the commit author
        run: git config user.name 'github-actions[bot]'

      - name: Give the commit author an address
        run: git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Clone vcpkg
        run: git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"

      - name: Check out the pinned vcpkg
        run: git -C "$RUNNER_TEMP/vcpkg" checkout --detach 94a541197763a4f449a1b91478df48c0584a6256

      - name: Bootstrap vcpkg
        run: '"$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics'

      - name: Commit the versions database
        if: steps.port.outputs.already != 'true'
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: uv run scripts/release/release_steps.py commit-versions --version "$VERSION" --vcpkg "$RUNNER_TEMP/vcpkg/vcpkg"

      - name: The versions database describes the ports
        run: uv run scripts/vcpkg/vcpkg_registry.py check

      - name: A consumer resolves the prepared registry
        run: uv run scripts/vcpkg/vcpkg_registry.py probe --vcpkg "$RUNNER_TEMP/vcpkg" --triplet x64-linux --feature mcp

      - name: The tag still names the release commit
        run: uv run scripts/release/release_steps.py tag-fixed

      - name: Record the prepared baseline
        id: prepare
        run: uv run scripts/release/release_steps.py record-baseline

      - name: Push the exact prepared baseline
        if: steps.port.outputs.already != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run scripts/release/release_steps.py push-baseline --repository "$GITHUB_REPOSITORY"

      - name: The checkout is the prepared baseline
        env:
          BASELINE: ${{ steps.prepare.outputs.baseline }}
        run: uv run scripts/release/release_steps.py head-is --commit "$BASELINE"

      - name: Resolve the public baseline
        run: uv run scripts/vcpkg/vcpkg_registry.py probe --vcpkg "$RUNNER_TEMP/vcpkg" --triplet x64-linux --feature mcp --repository "https://github.com/$GITHUB_REPOSITORY"

  registry-windows:
    needs: [registry]
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.registry.outputs.baseline }}

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.0"

      - name: Clone vcpkg
        run: git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"

      - name: Check out the pinned vcpkg
        run: git -C "$env:RUNNER_TEMP\vcpkg" checkout --detach 94a541197763a4f449a1b91478df48c0584a6256

      - name: Bootstrap vcpkg
        run: '& "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics'

      - name: Resolve and consume the published Windows baseline
        run: uv run scripts/vcpkg/vcpkg_registry.py probe --vcpkg "$env:RUNNER_TEMP\vcpkg" --triplet x64-windows --feature mcp --repository "https://github.com/$env:GITHUB_REPOSITORY"
