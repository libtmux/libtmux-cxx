name: codeql

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly, because a new query can find something in code that has not
    # changed.
    - cron: '31 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # Restated: a job-level block replaces the workflow-level one, so
      # without this the job cannot check out the repository it analyses.
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          # `languages`, plural. The singular is not an input, and an action
          # ignores what it does not recognise rather than failing — so CodeQL
          # never saw a restriction, autodetected both languages in both matrix
          # jobs, and the Python job died finalising a C++ database it had been
          # told not to build.
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Build the library for analysis
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++
          # The library alone: CodeQL wants the shipped code, and the tests
          # and examples would triple the analysis for code nobody consumes.
          cmake -S . -B build/codeql -G Ninja \
            -DLIBTMUX_BUILD_TESTS=OFF -DLIBTMUX_BUILD_EXAMPLES=OFF
          cmake --build build/codeql

      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
