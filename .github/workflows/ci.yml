name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  compatibility:
    # The C++ library claims the same tmux range as the Python one, so it is
    # tested against the same versions rather than only the newest.

    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tmux-version: ['3.2a', '3.3a', '3.4', '3.5', '3.6', '3.7', '3.7a', '3.7b', 'master']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `install` defaults to `detect`, so the action installs ccache with
      # the runner's package manager -- apt on Linux, brew on macOS -- and
      # never downloads the ccache build pinned in its own metadata.json.
      # A bump to this action therefore moves @actions/cache and the action's
      # own bundle, not the ccache binary: CI currently runs ccache 4.9.1 on
      # ubuntu-latest and 4.14 on macos-latest.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-tmux-${{ matrix.tmux-version }}
          max-size: 400M

      - name: Install the pinned toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev ninja-build
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Resolve the tmux revision
        id: tmux-ref
        run: |
          echo "sha=$(git ls-remote https://github.com/tmux/tmux.git ${{ matrix.tmux-version }} | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Setup tmux build cache for tmux ${{ matrix.tmux-version }}
        id: tmux-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/tmux-builds/tmux-${{ matrix.tmux-version }}
          # The commit, not the ref: a key of "tmux-master" would freeze this
          # lane at whatever the first run happened to build, and keep passing.
          key: tmux-${{ matrix.tmux-version }}-${{ steps.tmux-ref.outputs.sha }}

      - name: Build tmux ${{ matrix.tmux-version }}
        if: steps.tmux-build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y libevent-dev libncurses5-dev libtinfo-dev libutempter-dev bison
          mkdir -p ~/tmux-builds ~/tmux-src
          git clone https://github.com/tmux/tmux.git ~/tmux-src/tmux-${{ matrix.tmux-version }}
          cd ~/tmux-src/tmux-${{ matrix.tmux-version }}
          git checkout ${{ matrix.tmux-version }}
          sh autogen.sh
          ./configure --prefix="$HOME/tmux-builds/tmux-${{ matrix.tmux-version }}" && make && make install

      - name: Build and test against tmux ${{ matrix.tmux-version }}
        run: |
          export PATH=$HOME/tmux-builds/tmux-${{ matrix.tmux-version }}/bin:$PATH
          tmux -V
          cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx-dev
          cmake --build --preset cxx-dev
          ctest --preset cxx-dev --no-tests=error --output-on-failure

      - name: Test with a macOS-length temporary path
        if: matrix.tmux-version == '3.7b'
        run: |
          export PATH=$HOME/tmux-builds/tmux-${{ matrix.tmux-version }}/bin:$PATH
          base="/tmp/$(printf 'm%.0s' $(seq 1 52))"
          mkdir "$base"
          status=0
          TMPDIR="$base" ctest --preset cxx-dev --no-tests=error \
            --output-on-failure || status=$?
          rmdir "$base" || status=1
          exit "$status"

  macos:
    # tmux is used at least as much on macOS as on Linux, and Apple Clang with
    # its own libc++ is a different compiler from the pinned one. Nothing here
    # had ever been built on it.

    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: macos
          max-size: 400M

      - name: Install tmux and Ninja
        run: brew install tmux ninja

      - name: Build and test with Apple Clang
        run: |
          tmux -V
          # Not a preset: the pinned toolchain file names a libc++ that comes
          # from a Homebrew LLVM this runner does not have. Apple Clang brings
          # its own, which is the point of the lane.
          #
          # `LIBTMUX_FETCH_DEPS=ON` because the presets that build tests on
          # Linux get GoogleTest from the system, and there is none here.
          cmake -S . -B build/macos -G Ninja -DCMAKE_CXX_STANDARD=23 \
            -DLIBTMUX_FETCH_DEPS=ON
          cmake --build build/macos
          ctest --test-dir build/macos --no-tests=error --output-on-failure

  windows:
    # Exercise the narrower psmux backend and installed package with MSVC;
    # a MinGW-only success cannot stand in for Windows support.

    strategy:
      fail-fast: false
      matrix:
        standard: [20, 23]
    # The preset intentionally targets Visual Studio 2022, and this image also
    # keeps WSLv1 enabled for the interop gate below.
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Windows registry tooling
        run: python -m unittest tools.vcpkg.test_probe tools.vcpkg.test_release

      - name: Install the pinned psmux release
        run: |
          $url = "https://github.com/psmux/psmux/releases/download/v3.3.7/psmux-v3.3.7-windows-x64.zip"
          $expected = "60ff7b236f64184921cef3c1ff2611aa5a36fcc7ed8e2a58e968b8ded57f6028"
          $archive = Join-Path $env:RUNNER_TEMP "psmux-v3.3.7-windows-x64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "psmux-v3.3.7"

          curl.exe --fail --location --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) {
            throw "failed to download psmux v3.3.7"
          }

          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "psmux SHA-256 mismatch: expected $expected, got $actual"
          }

          Expand-Archive -Path $archive -DestinationPath $destination
          $binary = Join-Path $destination "tmux.exe"
          $expectedBinary = "f3a4ad033f0332972bc79b8d695387adb4fcd1d268074e113c1c84e5381051a6"
          $actualBinary = (Get-FileHash -Algorithm SHA256 $binary).Hash.ToLowerInvariant()
          if ($actualBinary -ne $expectedBinary) {
            throw "psmux executable SHA-256 mismatch: expected $expectedBinary, got $actualBinary"
          }
          $reported = @(& $binary -V 2>&1)
          if ($LASTEXITCODE -ne 0 -or $reported[0] -ne "tmux 3.3.7") {
            throw "unexpected psmux version: $($reported -join '; ')"
          }
          $reported
          $destination | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "LIBTMUX_PSMUX_EXE=$binary" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and run the native Windows smoke
        run: |
          $resolved = (Get-Command tmux.exe -ErrorAction Stop).Source
          $expectedPath = (Resolve-Path $env:LIBTMUX_PSMUX_EXE).Path
          if ((Resolve-Path $resolved).Path -ne $expectedPath) {
            throw "psmux route changed: expected $expectedPath, got $resolved"
          }
          $expectedHash = "f3a4ad033f0332972bc79b8d695387adb4fcd1d268074e113c1c84e5381051a6"
          $actualHash = (Get-FileHash -Algorithm SHA256 $resolved).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "resolved psmux SHA-256 mismatch: expected $expectedHash, got $actualHash"
          }
          cmake --preset windows-psmux "-DLIBTMUX_CXX_STANDARD=${{ matrix.standard }}"
          cmake --build --preset windows-psmux
          ctest --preset windows-psmux --no-tests=error

      - name: Build and run the native Windows smoke in Release
        run: |
          cmake --build build/windows-psmux --config Release
          ctest --test-dir build/windows-psmux -C Release --no-tests=error

      - name: Kill the Windows psmux safety mutations
        run: |
          python -m tools.mutate `
            --preset windows-psmux `
            --id windows-psmux-disables-warm-claiming `
            --id windows-psmux-clears-inherited-route `
            --id windows-psmux-rejects-rebound-snapshot `
            --id windows-psmux-cleanup-reports-success

      - name: Run the Windows gates from WSL
        run: |
          $name = "libtmux-cxx-${{ matrix.standard }}-$env:GITHUB_RUN_ATTEMPT"
          $archiveName = "alpine-minirootfs-3.23.5-x86_64.tar.gz"
          $url = "https://dl-cdn.alpinelinux.org/alpine/v3.23/releases/x86_64/$archiveName"
          # Alpine rebuilds minirootfs archives under their existing version, so
          # this hash moves without the version moving. Take it from $url.sha256.
          $expected = "fae0d78ad39563573ddececfdd55ae1040ed428442e95ea5401cf66d9079b327"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $tar = Join-Path $env:RUNNER_TEMP "alpine-minirootfs-3.23.5-x86_64.tar"
          $root = Join-Path $env:RUNNER_TEMP "$name-root"

          curl.exe --fail --location --retry 3 --output $archive $url
          if ($LASTEXITCODE -ne 0) {
            throw "failed to download the WSL interop rootfs"
          }
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Alpine rootfs SHA-256 mismatch: expected $expected, got $actual"
          }
          & 7z.exe e $archive "-o$env:RUNNER_TEMP" -y | Out-Host
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $tar)) {
            throw "failed to decompress the WSL interop rootfs"
          }

          try {
            & wsl.exe --import $name $root $tar --version 1
            if ($LASTEXITCODE -ne 0) {
              throw "failed to import the WSLv1 interop distribution"
            }

            $workspace = (Resolve-Path $PWD).Path
            $testDir = Join-Path $workspace "build\windows-psmux"
            $proof = Join-Path $workspace "build\verify-psmux-route.ps1"
            @(
              'param('
              '  [Parameter(Mandatory = $true)][string]$ExpectedPsmux,'
              '  [Parameter(Mandatory = $true)][string]$CTest,'
              '  [Parameter(Mandatory = $true)][string]$TestDir'
              ')'
              '$ErrorActionPreference = "Stop"'
              '$expected = (Resolve-Path $ExpectedPsmux).Path'
              '$env:PATH = "$(Split-Path $expected);$env:PATH"'
              '$env:PATHEXT = ".CPL"'
              'if ($env:PATHEXT -ne ".CPL") { throw "could not poison PATHEXT" }'
              '$resolved = (Get-Command tmux.exe -ErrorAction Stop).Source'
              'if ((Resolve-Path $resolved).Path -ne $expected) {'
              '  throw "WSL psmux route changed: expected $expected, got $resolved"'
              '}'
              '$expectedHash = "f3a4ad033f0332972bc79b8d695387adb4fcd1d268074e113c1c84e5381051a6"'
              '$actualHash = (Get-FileHash -Algorithm SHA256 $resolved).Hash.ToLowerInvariant()'
              'if ($actualHash -ne $expectedHash) {'
              '  throw "WSL psmux SHA-256 mismatch: expected $expectedHash, got $actualHash"'
              '}'
              '& $CTest --test-dir $TestDir -C Debug -L windows --no-tests=error --output-on-failure'
              'if ($LASTEXITCODE -ne 0) {'
              '  throw "the WSL-to-Windows psmux gates failed"'
              '}'
            ) | Set-Content -Path $proof -Encoding ascii

            $ctestWindows = (Get-Command ctest.exe -ErrorAction Stop).Source
            $powershellWindows = (Get-Command powershell.exe -ErrorAction Stop).Source
            if ($powershellWindows -notmatch '^([A-Za-z]):\\(.+)$') {
              throw "cannot map Windows PowerShell into WSL: $powershellWindows"
            }
            $drive = $Matches[1].ToLowerInvariant()
            $tail = $Matches[2] -replace '\\', '/'
            $powershellWsl = "/mnt/$drive/$tail"
            & wsl.exe -d $name -- test -x $powershellWsl
            if ($LASTEXITCODE -ne 0) {
              throw "Windows PowerShell is not executable inside WSL: $powershellWsl"
            }
            & wsl.exe -d $name -- $powershellWsl `
              -NoLogo -NoProfile -NonInteractive `
              -ExecutionPolicy Bypass -File $proof `
              -ExpectedPsmux $env:LIBTMUX_PSMUX_EXE `
              -CTest $ctestWindows -TestDir $testDir
            if ($LASTEXITCODE -ne 0) {
              throw "the WSL psmux route and runtime gates failed"
            }
          } finally {
            $savedNativePreference = $PSNativeCommandUseErrorActionPreference
            $PSNativeCommandUseErrorActionPreference = $false
            try {
              & wsl.exe --unregister $name 2>$null | Out-Host
              $registered = @(
                & wsl.exe --list --quiet 2>$null |
                  ForEach-Object { ($_ -replace "`0", "").Trim() }
              )
              $listStatus = $LASTEXITCODE
            } finally {
              $PSNativeCommandUseErrorActionPreference = $savedNativePreference
            }
            if ($listStatus -ne 0) {
              throw "could not verify WSL distribution teardown"
            }
            if ($registered -contains $name) {
              throw "failed to unregister the task-owned WSL distribution"
            }
          }

      - name: Check private psmux cleanup
        if: always()
        run: |
          $state = Join-Path $HOME ".psmux"
          if (Test-Path $state) {
            $leaks = @(Get-ChildItem -Path $state -Recurse -File |
              Where-Object { $_.Name -like "libtmux-cxx-*" })
            if ($leaks.Count -ne 0) {
              throw "private psmux state leaked:`n$($leaks.FullName -join "`n")"
            }
          }

      - name: Install and consume the MSVC package
        run: |
          $prefix = Join-Path $PWD "build\windows-prefix"
          cmake --install build/windows-psmux --config Debug --prefix $prefix
          cmake -S examples/consume `
            -B build/windows-consume `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DCMAKE_PREFIX_PATH=$prefix"
          cmake --build build/windows-consume --config Debug
          & ".\build\windows-consume\Debug\consume.exe"

      - name: Reject the POSIX-only testing component
        run: |
          $prefix = Join-Path $PWD "build\windows-prefix"
          $source = Join-Path $PWD "build\windows-testing-consumer-src"
          $build = Join-Path $PWD "build\windows-testing-consumer"
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          @'
          cmake_minimum_required(VERSION 3.25)
          project(libtmux_windows_testing_consumer LANGUAGES CXX)
          find_package(libtmux REQUIRED COMPONENTS testing)
          '@ | Set-Content -Path (Join-Path $source "CMakeLists.txt") -Encoding ascii

          $savedNativePreference = $PSNativeCommandUseErrorActionPreference
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            $output = @(& cmake -S $source -B $build `
              -G "Visual Studio 17 2022" -A x64 `
              "-DCMAKE_PREFIX_PATH=$prefix" 2>&1)
            $status = $LASTEXITCODE
          } finally {
            $PSNativeCommandUseErrorActionPreference = $savedNativePreference
          }
          if ($status -eq 0) {
            throw "the Windows package unexpectedly provided libtmux::testing"
          }
          $reported = $output -join "`n"
          $normalized = $reported -replace '\s+', ' '
          $expected = "the libtmux::testing component is POSIX-only and is unavailable in Windows packages"
          if (-not $normalized.Contains($expected)) {
            throw "missing testing-component diagnostic:`n$reported"
          }
          $global:LASTEXITCODE = 0
          $expected

      - name: Check the installed Windows MCP catalog
        run: |
          $server = Join-Path $PWD "build\windows-prefix\bin\libtmux-mcp-server.exe"
          if (-not (Test-Path $server)) {
            throw "installed MCP server is missing: $server"
          }
          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
            '{"jsonrpc":"2.0","method":"notifications/initialized"}'
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
          )
          $lines = @($requests | & $server --socket-name libtmux-cxx-mcp-catalog)
          if ($LASTEXITCODE -ne 0) {
            throw "installed MCP server exited with $LASTEXITCODE"
          }
          $replies = @($lines | ForEach-Object { $_ | ConvertFrom-Json })
          $catalog = @($replies | Where-Object { $_.id -eq 2 })
          if ($catalog.Count -ne 1) {
            throw "expected one tools/list reply, got $($catalog.Count)"
          }
          $actual = @($catalog[0].result.tools.name | Sort-Object)
          $expected = @(
            "inspect_tmux"
            "list_session_panes"
            "list_sessions"
            "list_windows"
          )
          $difference = @(Compare-Object -ReferenceObject $expected -DifferenceObject $actual)
          if ($difference.Count -ne 0) {
            throw "unexpected Windows MCP tools: $($actual -join ', ')"
          }
          "Windows MCP tools: $($actual -join ', ')"

  toolchains:
    # A second compiler and standard library. Everything here built and passed
    # only under clang and libc++ until three lines of duration arithmetic were
    # spelled explicitly, which no lane would have caught.

    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install GCC, tmux and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ tmux ninja-build

      - name: Build and test with GCC and libstdc++
        run: |
          g++ --version
          cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx-gcc
          cmake --build --preset cxx-gcc
          ctest --preset cxx-gcc --no-tests=error --output-on-failure

  standards:
    # The C++20 configuration substitutes a different expected and carries its
    # own ABI namespace. Until this lane existed, the only thing that had ever
    # been built against it was one example program.

    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install the pinned toolchain and tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev ninja-build tmux
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Build and test the C++20 configuration
        run: |
          cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx20
          cmake --build --preset cxx20
          ctest --preset cxx20 --no-tests=error --output-on-failure

  fuzz:
    # Four parsers read input the library does not choose. A short run over the
    # checked-in corpus is the gate; it found a real ambiguity between an
    # option name that ends in an asterisk and the marker tmux uses for an
    # inherited one.

    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install the pinned toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Fuzz the parsers
        run: |
          # The fuzzer runtime this toolchain ships is built against libstdc++,
          # which has no usable <expected> here, so the fuzzers build in the
          # C++20 configuration over the pinned compatibility type.
          cmake -S . -B build/fuzz -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DLIBTMUX_CXX_STANDARD=20 -DLIBTMUX_BUILD_FUZZERS=ON \
            -DLIBTMUX_BUILD_TESTS=OFF -DLIBTMUX_BUILD_EXAMPLES=OFF \
            -DLIBTMUX_FETCH_DEPS=ON
          cmake --build build/fuzz
          ctest --test-dir build/fuzz --no-tests=error --output-on-failure

  locale:
    # tmux decides whether the terminal is UTF-8 from the environment, and the
    # separator this library asks it to print between format values is
    # multi-byte. A lane that is not UTF-8 is the only thing that checks the
    # library does not depend on its caller's locale.

    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install the pinned toolchain and tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev ninja-build tmux
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Build and test in a C locale
        env:
          LC_ALL: C
          LC_CTYPE: C
        run: |
          unset LANG
          cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx-dev
          cmake --build --preset cxx-dev
          ctest --preset cxx-dev --no-tests=error --output-on-failure

  sanitizers:

    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Address and thread sanitizers need separate build trees; enabling
        # both at once is rejected at configure time.
        sanitizer: [cxx-sanitize, cxx-sanitize-cxx20, cxx-tsan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ matrix.sanitizer }}
          max-size: 400M

      - name: Install the pinned toolchain and tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev ninja-build tmux
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Run the suite under ${{ matrix.sanitizer }}
        run: |
          cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset ${{ matrix.sanitizer }}
          cmake --build --preset ${{ matrix.sanitizer }}
          ctest --preset ${{ matrix.sanitizer }} --no-tests=error --output-on-failure

  mutation:
    # A green suite is evidence only once it has been shown capable of
    # failing. Each catalogued mutation breaks one guard that exists because
    # tmux does something quiet, and a survivor names what went unnoticed.
    # A mutation that no longer applies, or no longer builds, fails the job
    # too: run by hand that case prints nothing and reads like a pass.

    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install tmux and a compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux ninja-build clang-18 libc++-18-dev \
            libc++abi-18-dev
          for tool in clang clang++; do
            sudo update-alternatives --install "/usr/bin/$tool" "$tool" \
              "/usr/bin/$tool-18" 100
          done

      - name: Configure
        run: cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx-dev

      - name: Break each guard and check something notices
        run: python3 -m tools.mutate --preset cxx-dev

  parity:
    # The Python surface this port is measured against is recorded as a
    # ledger, and the project's own bar is "no unclassified entries". That bar
    # is not met yet, so this enforces what is true today — the ledger is
    # structurally sound — and prints how far the classification has to go, so
    # the number is in front of someone on every run rather than discovered
    # months later.

    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The ledger is validated against a JSON schema, so the tooling has real
      # dependencies. An interpreter of its own rather than the system one: on
      # Ubuntu that is externally managed and refuses to be installed into.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the tooling's dependencies
        run: python3 -m pip install --disable-pip-version-check -e .

      - name: The ledger is structurally sound
        run: |
          python3 -m tools.parity verify \
            --manifest tools/parity/data/manifest.json \
            --mode structural --allow-pending

      - name: How much of the Python surface is still unclassified
        run: |
          python3 -m tools.parity verify \
            --manifest tools/parity/data/manifest.json --mode complete \
            > report.txt 2>&1 || true
          python3 - <<'COUNT'
          import collections, json, pathlib
          load = lambda name: json.loads(
              pathlib.Path(f"tools/parity/data/{name}.json").read_text())
          rows = load("mapping")["entries"]
          status = collections.Counter(row["status"] for row in rows)
          print(f"{len(rows)} entries in the ledger")
          for name, count in status.most_common():
              print(f"  {count:>5}  {name}")
          reasons = collections.Counter(
              line.rsplit(": ", 1)[-1]
              for line in pathlib.Path("report.txt").read_text().splitlines()
              if line.strip())
          for reason, count in reasons.most_common():
              print(f"  {count:>5}  {reason}")

          # The work is ordered into shards, so progress is legible as steps
          # taken rather than as one number that moves slowly.
          shards = load("shards")
          by_id = {row["entry_id"]: row["status"] for row in rows}
          print("\nby shard, in dependency order:")
          for name in shards["dependency_order"]:
              shard = next(s for s in shards["shards"] if s["name"] == name)
              ids = shard["entry_ids"]
              done = sum(1 for i in ids if by_id.get(i) != "pending")
              print(f"  {done:>4}/{len(ids):<4} {name}")
          COUNT

  coverage:
    # Not here to police a percentage. Coverage tooling is used by nobody on
    # an ordinary day, so it rots quietly and is then untrustworthy exactly
    # when someone reaches for it; running it every time keeps it honest. The
    # floor is set well under the current figure so it catches a collapse —
    # instrumentation silently disabled, a suite that stopped running — and
    # not the ordinary drift of a few lines.

    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install the pinned toolchain and tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev \
            llvm-18 ninja-build tmux
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Measure what the suite reaches
        run: |
          cmake -DCMAKE_CXX_COMPILER_LAUNCHER=ccache --preset cxx-coverage
          cmake --build --preset cxx-coverage
          ctest --preset cxx-coverage --no-tests=error --output-on-failure
          python3 tools/coverage/report.py \
            --build build/cxx-coverage --source . --floor 65

  lint:

    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Python tool runner
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 400M

      - name: Install the pinned toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18 \
            libc++-18-dev libc++abi-18-dev ninja-build
          for tool in clang clang++ clang-format clang-tidy; do
            sudo update-alternatives --install /usr/bin/$tool $tool /usr/bin/$tool-18 100
          done

      # release.yml triggers on tags alone, so no other lane parses it. An
      # unsupported key there fails every release before a job can start.
      - name: Check the workflows parse
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar xzf "$archive" actionlint
          ./actionlint -color

      - name: Check formatting
        run: |
          find include src tests apps examples \
            \( -name '*.hpp' -o -name '*.cpp' \) \
            -exec clang-format --dry-run --Werror --style=file {} +

      - name: Check the API reference is current
        run: |
          python3 tools/docs/api_index.py \
            --include include/libtmux --output docs/api.md --check
          python3 tools/docs/api_index.py \
            --include include/libtmux/testing --output docs/api-testing.md \
            --page testing --check

      - name: Check Python tooling
        run: |
          uvx --from ruff==0.16.1 ruff format --check .
          uvx --from ruff==0.16.1 ruff check .
          uv run --no-project python -m unittest \
            tools.docs.test_api_index tools.mutate.test_main \
            tools.mutate.test_runner tools.vcpkg.test_probe \
            tools.vcpkg.test_release
          uv run --no-project --with tomlkit==0.15.1 \
            python -m unittest tools.mcp.test_mcp_swap

      # The README's C++ is quoted from an example that is compiled and run.
      # This is the half that checks the quoting; the example lane checks that
      # the code still works.
      - name: Check the README quotes code that builds
        run: python3 tools/docs/check_readme.py

      - name: Run clang-tidy over the library
        run: |
          cmake -S . -B build/tidy -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/clang-libcxx.cmake \
            -DLIBTMUX_ENABLE_CLANG_TIDY=ON -DLIBTMUX_BUILD_TESTS=OFF
          cmake --build build/tidy

  package:
    # Proves the shipped package, not the build tree: install it and build an
    # outside project that knows only find_package.

    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        standard: ['23', '20']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-cxx${{ matrix.standard }}
          max-size: 400M

      - name: Install the pinned toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libc++-18-dev libc++abi-18-dev ninja-build
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Install and consume with C++${{ matrix.standard }}
        run: |
          cmake -S . -B build/pkg -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/clang-libcxx.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DLIBTMUX_CXX_STANDARD=${{ matrix.standard }} \
            -DLIBTMUX_BUILD_TESTS=OFF \
            -DLIBTMUX_BUILD_MCP_SERVER=ON \
            -DLIBTMUX_BUILD_TESTING_LIBRARY=ON \
            -DLIBTMUX_FETCH_DEPS=ON
          cmake --build build/pkg
          cmake --install build/pkg --prefix "$PWD/build/prefix"
          if [ '${{ matrix.standard }}' = 20 ]; then
            test -f build/prefix/include/tl/expected.hpp
          else
            test ! -e build/prefix/include/tl/expected.hpp
          fi
          test ! -e build/prefix/share/cmake/tl-expected
          cmake -S examples/consume -B build/consume \
            -DCMAKE_PREFIX_PATH="$PWD/build/prefix" \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-stdlib=libc++
          cmake --build build/consume
          ./build/consume/consume

      # The examples, built and run the way a reader would: as their own
      # project, against the install above, knowing nothing but
      # `find_package`. The in-tree lane already runs the same sources, so
      # this is not about the examples working — it is about the package
      # being enough to build and test them, which only fails here.
      #
      # tmux, because unlike every other step in this job these tests drive a
      # real server. They start it themselves, under a namespaced socket in a
      # directory they remove.
      - name: The installed package is enough to test the examples
        run: |
          sudo apt-get install -y tmux
          cmake -S examples -B build/examples -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/build/prefix" \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_FLAGS=-stdlib=libc++ \
            -DLIBTMUX_EXAMPLES_BUILD_TESTS=ON \
            -DLIBTMUX_FETCH_DEPS=ON
          cmake --build build/examples
          ctest --test-dir build/examples --no-tests=error --output-on-failure

      # The program is the half of the package a library consumer never
      # links, so building it is not enough: this runs the installed copy the
      # way an agent starts it, over stdio, and requires a reply.
      #
      # Needs no tmux. These requests are answered by the protocol layer alone,
      # which is what this job is for — whether the tools then drive tmux
      # correctly is what the test lanes run a real server to find out.
      - name: The installed MCP server answers on stdio
        run: |
          test -x build/prefix/bin/libtmux-mcp-server
          SERVER="$PWD/build/prefix/bin/libtmux-mcp-server" \
          SOCKET_NAME="libtmux-cxx-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-catalog" \
          python3 - <<'PROBE'
          import json, os, select, subprocess

          process = subprocess.Popen(
              [os.environ["SERVER"], "--socket-name", os.environ["SOCKET_NAME"]],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              text=True, bufsize=1)

          def send(message):
              process.stdin.write(json.dumps(message, separators=(",", ":")) + "\n")
              process.stdin.flush()

          def receive(expected_id):
              ready, _, _ = select.select([process.stdout], [], [], 10)
              if not ready:
                  raise TimeoutError(f"timed out waiting for response {expected_id}")
              reply = json.loads(process.stdout.readline())
              if reply.get("id") != expected_id:
                  raise RuntimeError(f"expected response {expected_id}, got {reply}")
              return reply

          try:
              send({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                    "params": {"protocolVersion": "2025-06-18", "capabilities": {},
                               "clientInfo": {"name": "ci", "version": "1"}}})
              initialized = receive(1)
              send({"jsonrpc": "2.0", "method": "notifications/initialized"})
              send({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})
              listed = receive(2)
              send({"jsonrpc": "2.0", "id": 3, "method": "tools/call",
                    "params": {"name": "capture_pane", "arguments": {"target": 99},
                               "_meta": {"progressToken": "ci",
                                         "claudeCode": {"version": "ci"}}}})
              called = receive(3)
          finally:
              process.stdin.close()
              try:
                  return_code = process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=10)
                  raise

          if return_code != 0:
              raise RuntimeError(process.stderr.read())
          if initialized["result"]["serverInfo"]["name"] != "libtmux-cxx":
              raise RuntimeError(f"unexpected serverInfo: {initialized['result']['serverInfo']}")
          names = sorted(tool["name"] for tool in listed["result"]["tools"])
          if not names:
              raise RuntimeError("the server advertised no tools")
          if called.get("error") != {"code": -32602,
                                     "message": "argument target must be a string"}:
              raise RuntimeError(f"tools/call lost arguments or _meta: {called}")
          print("tools:", ", ".join(names))
          PROBE

      # Well-formed JSON that is not a well-formed request. Each of these
      # parsed cleanly and then threw out of a typed read, which escaped main
      # and ended the process — so a peer could stop the server with a line
      # containing `[1,2,3]`. Malformed JSON was already handled; being valid
      # JSON of the wrong shape was the gap.
      - name: The installed MCP server survives valid JSON of the wrong shape
        run: |
          socket_name="libtmux-cxx-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-hostile"
          printf '%s\n' \
            '[1,2,3]' \
            '"a string"' \
            '42' \
            'null' \
            '{"jsonrpc":2.0,"id":1,"method":"ping"}' \
            '{"jsonrpc":"2.0","id":{"not":"scalar"},"method":"ping"}' \
            '{"jsonrpc":"2.0","id":1}' \
            '{"jsonrpc":"2.0","id":2,"method":42}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":[]}' \
            '{not json at all' \
            '{"jsonrpc":"2.0","id":99,"method":"ping"}' \
            | build/prefix/bin/libtmux-mcp-server --socket-name "$socket_name" \
              > /tmp/mcp-hostile.jsonl
          python3 - <<'PROBE'
          import json, pathlib, sys
          lines = [line for line in
                   pathlib.Path("/tmp/mcp-hostile.jsonl").read_text().splitlines()
                   if line.strip()]
          replies = [json.loads(line) for line in lines]
          for reply in replies:
              if "error" not in reply and reply.get("id") != 99:
                  sys.exit(f"expected an error reply, got {reply}")
          # The last request is well formed, so the server must still be there
          # to answer it: surviving means answering, not merely not crashing.
          final = [reply for reply in replies if reply.get("id") == 99]
          if len(final) != 1 or "result" not in final[0]:
              sys.exit(f"the server stopped answering: {replies}")
          print(f"answered {len(replies)} lines and stayed up")
          PROBE

  registry:
    # This repository is a vcpkg git registry, so a consumer resolves the port
    # through `versions/` rather than from `ports/` directly. Two questions,
    # and the cheap one does not answer the expensive one: whether the database
    # still describes the ports, and whether vcpkg can actually resolve them.

    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Unshallowed because vcpkg fetches the baseline commit out of this
      # clone, and resolves the port from the git-tree recorded against it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The versions database describes the ports
        run: python3 -m tools.vcpkg check

      - name: Install vcpkg
        run: |
          git clone --filter=blob:none \
            https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach \
            94a541197763a4f449a1b91478df48c0584a6256
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      # The whole chain a consumer walks: baseline commit, git-tree, release
      # tarball by hash, package config, find_package. It is also the only
      # place the shipped MCP server is run from an installed tree rather than
      # a build tree.
      - name: A consumer resolves the port and builds on it
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          python3 -m tools.vcpkg probe \
            --vcpkg "$RUNNER_TEMP/vcpkg" \
            --triplet x64-linux \
            --feature mcp

  all-checks-passed:
    # Branch protection requires this one job. Naming every matrix leg there
    # instead would mean editing the protection rule whenever a tmux version
    # or a sanitizer is added, and a leg that is renamed and forgotten stops
    # being required without anything saying so.
    if: always()
    needs:
      - compatibility
      - macos
      - windows
      - toolchains
      - standards
      - fuzz
      - locale
      - sanitizers
      - mutation
      - parity
      - coverage
      - lint
      - package
      - registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        run: |
          # `needs.*.result` is skipped or cancelled as well as success and
          # failure, and only success will do.
          results='${{ join(needs.*.result, ' ') }}'
          echo "$results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "a required job reported: $result" >&2
              exit 1
            fi
          done
